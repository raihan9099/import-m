<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MongoDB Control Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .section h2 { margin-top: 0; font-size: 18px; color: #555; }
        input[type="text"], input[type="email"] { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #c82333; }
        .btn-import { background-color: #007bff; }
        .btn-import:hover { background-color: #0056b3; }
        ul { list-style-type: none; padding: 0; }
        li { background: #f9f9f9; padding: 10px; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #28a745; }
        .message { margin-top: 10px; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h1>MongoDB System Panel</h1>

    <!-- ডেটা ইমপোর্ট সেকশন -->
    <div class="section">
        <h2>📥 Import Data from External Link</h2>
        <input type="text" id="importUri" placeholder="Paste External MongoDB URI here...">
        <button class="btn-import" onclick="importData()">Import Now</button>
        <div id="importMessage" class="message"></div>
    </div>

    <!-- নতুন ডেটা অ্যাড সেকশন -->
    <div class="section">
        <h2>➕ Add New User</h2>
        <input type="text" id="userName" placeholder="Enter Name">
        <input type="email" id="userEmail" placeholder="Enter Email">
        <button onclick="addUser()">Save User</button>
    </div>

    <!-- ডেটা দেখার সেকশন -->
    <div class="section">
        <h2>📋 Saved Data</h2>
        <button onclick="fetchUsers()">Refresh List</button>
        <ul id="userList"></ul>
    </div>
</div>

<script>
    const API_BASE = '/api';

    // ১. ডেটা লোড করা
    async function fetchUsers() {
        try {
            const response = await fetch(`${API_BASE}/users`);
            const result = await response.json();
            const list = document.getElementById('userList');
            list.innerHTML = '';
            
            if(result.data.length === 0) {
                list.innerHTML = '<li>No data found!</li>';
                return;
            }

            result.data.forEach(user => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span><b>${user.name}</b> (${user.email})</span>
                    <button class="btn-danger" onclick="deleteUser('${user._id}')">Delete</button>
                `;
                list.appendChild(li);
            });
        } catch (error) {
            console.error("Error fetching data:", error);
        }
    }

    // ২. নতুন ডেটা অ্যাড করা
    async function addUser() {
        const name = document.getElementById('userName').value;
        const email = document.getElementById('userEmail').value;
        
        if(!name || !email) return alert("Please fill all fields!");

        try {
            await fetch(`${API_BASE}/users`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email })
            });
            document.getElementById('userName').value = '';
            document.getElementById('userEmail').value = '';
            fetchUsers(); // লিস্ট রিফ্রেশ করা
        } catch (error) {
            console.error("Error adding user:", error);
        }
    }

    // ৩. ডেটা ডিলিট করা
    async function deleteUser(id) {
        if(!confirm("Are you sure you want to delete this?")) return;
        try {
            await fetch(`${API_BASE}/users/${id}`, { method: 'DELETE' });
            fetchUsers(); // লিস্ট রিফ্রেশ করা
        } catch (error) {
            console.error("Error deleting user:", error);
        }
    }

    // ৪. অন্য লিংক থেকে ডেটা ইমপোর্ট করা
    async function importData() {
        const uri = document.getElementById('importUri').value;
        const msgBox = document.getElementById('importMessage');
        
        if(!uri) return alert("Please paste a valid MongoDB URI!");

        msgBox.style.color = "#007bff";
        msgBox.innerText = "Importing... Please wait...";

        try {
            const response = await fetch(`${API_BASE}/import`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ externalUri: uri })
            });
            const result = await response.json();
            
            if(response.ok) {
                msgBox.style.color = "green";
                msgBox.innerText = result.message;
                document.getElementById('importUri').value = '';
                fetchUsers(); // ইমপোর্ট হওয়ার পর লিস্ট রিফ্রেশ করা
            } else {
                msgBox.style.color = "red";
                msgBox.innerText = result.error;
            }
        } catch (error) {
            msgBox.style.color = "red";
            msgBox.innerText = "Server error!";
        }
    }

    // পেজ লোড হলেই ডেটা নিয়ে আসবে
    window.onload = fetchUsers;
</script>

</body>
</html>
